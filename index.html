<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auron — контроль якості імпорту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D12;
    --bg-alt:#10131A;
    --surface:#171B24;
    --surface-hi:#1E2430;
    --border:#262B36;
    --border-soft:#1D222C;
    --text:#EDEFF3;
    --text-dim:#8A93A6;
    --text-faint:#5B6373;
    --amber:#F2B705;
    --amber-dim:#7A5E12;
    --accent:#EA7C39;
    --accent-hover:#F28C4F;
    --on-accent:#2B1200;
    --accent-dim:#3A2414;
    --red:#FF5470;
    --red-dim:#4A1A26;
    --green:#34D399;
    --green-dim:#123B2C;
    --radius:14px;
    --radius-sm:8px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(234,124,57,0.09), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(242,183,5,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--on-accent);}
  a{color:var(--accent);}
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 80px;}
  .h-display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .hidden{display:none !important;}

  /* ===== Header ===== */
  header{
    border-bottom:1px solid var(--border-soft);
    background:rgba(11,13,18,0.85);
    backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:40;
  }
  .header-inner{
    max-width:1240px;margin:0 auto;padding:14px 28px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:11px;margin-right:auto;}
  .logo-mark{
    width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0;
    border:1px solid var(--border);
  }
  .logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .logo-text{line-height:1.15;}
  .logo-text .t1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.01em;}
  .logo-text .t2{font-size:11px;color:var(--text-faint);letter-spacing:0.06em;text-transform:uppercase;}

  .stat-pill{
    display:flex;flex-direction:column;padding:6px 14px;
    border:1px solid var(--border);border-radius:10px;background:var(--surface);
    min-width:76px;
  }
  .stat-pill b{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;}
  .stat-pill span{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

  .user-box{display:flex;align-items:center;gap:10px;}
  .user-chip{
    display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:100px;
    border:1px solid var(--border);background:var(--surface);
  }
  .user-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--accent-dim);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
    font-family:'Space Grotesk',sans-serif;flex-shrink:0;
  }
  .user-chip .uname{font-size:12.5px;font-weight:600;}
  .user-chip .role{font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    border-radius:10px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);padding:9px 15px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .btn:hover{border-color:#39404F;background:var(--surface-hi);}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{background:var(--red-dim);border-color:#6b2436;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  input[type=text],input[type=number],input[type=url],input[type=password],textarea,select{
    background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:9px 12px;font-family:'Inter',sans-serif;font-size:13.5px;
    outline:none;transition:border-color .15s ease;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  input::placeholder,textarea::placeholder{color:var(--text-faint);}

  /* ===== Auth screen ===== */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .auth-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;padding:30px 28px 26px;
  }
  .auth-logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;}
  .auth-logo .logo-mark{width:56px;height:56px;border-radius:14px;}
  .auth-logo .t1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;}
  .auth-logo .t2{font-size:12px;color:var(--text-faint);text-align:center;}
  .auth-tabs{display:flex;gap:6px;background:var(--bg-alt);border-radius:10px;padding:4px;margin-bottom:20px;}
  .auth-tab{
    flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:600;
    color:var(--text-dim);cursor:pointer;border:none;background:transparent;
  }
  .auth-tab.active{background:var(--surface-hi);color:var(--text);}
  .auth-form .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
  .auth-form label{font-size:12px;font-weight:600;color:var(--text-dim);}
  .auth-form input{width:100%;}
  .auth-error{color:var(--red);font-size:12px;margin:-2px 0 12px;min-height:0;}
  .auth-hint{font-size:11.5px;color:var(--text-faint);margin-top:14px;line-height:1.5;text-align:center;}
</style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div class="auth-wrap" id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAIAAAAiOjnJAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+[...]
      <div class="t1">AURON</div>
      <div class="t2">Контроль якості імпорту з Китаю</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Увійти</button>
      <button class="auth-tab" data-tab="register">Реєстрація</button>
    </div>

    <form class="auth-form" id="login-form">
      <div class="field">
        <label>Імʼя</label>
        <input type="text" id="login-name" placeholder="Ваше імʼя" autocomplete="given-name">
      </div>
      <div class="field">
        <label>Прізвище</label>
        <input type="text" id="login-lastname" placeholder="Ваше прізвище" autocomplete="family-name">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
      </div>
      <div class="auth-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-block">Увійти</button>
    </form>

    <form class="auth-form hidden" id="register-form">
      <div class="field">
        <label>Імʼя</label>
        <input type="text" id="reg-name" placeholder="Як до вас звертатись" autocomplete="given-name">
      </div>
      <div class="field">
        <label>Прізвище</label>
        <input type="text" id="reg-lastname" placeholder="Ваше прізвище" autocomplete="family-name">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="Не менше 4 символів" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Повторіть пароль</label>
        <input type="password" id="reg-password2" placeholder="Ще раз пароль" autocomplete="new-password">
      </div>
      <div class="auth-error" id="register-error"></div>
      <button type="submit" class="btn btn-primary btn-block">Створити акаунт</button>
    </form>

    <p class="auth-hint">Доступ до перегляду товарів і оцінок — лише для зареє��трованих користувачів. Додавати товар можуть тільки керівники.</p>
  </div>
</div>

<script>
(function(){
  var ADMIN_NAME = 'Олександр';
  var ADMIN_LASTNAME = 'Бойко';

  /* ===== UUID v4 GENERATOR =====
     Генерує унікальні ідентифікатори користувачів (UUID v4).
     Це гарантує, що кожен користувач матиме унікальний ID,
     навіть якщо у них однакові імʼя та прізвище. */
  function generateUUID(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  /* ===== STORAGE SHIM ===== */
  if (!window.storage){
    window.storage = (function(){
      var FIREBASE_DB_URL = 'https://auron-import-default-rtdb.europe-west1.firebasedatabase.app';
      var FIREBASE_API_KEY = 'AIzaSyCpBxbMQHuqRydFfiuiBOP1AvG0HClE1E4';
      var AUTH_CACHE_KEY = '__auron_fb_auth_v1__';
      var idToken = null;
      var refreshTokenVal = null;
      var expiresAt = 0;
      var authPromise = null;

      function loadCachedAuth(){
        try{
          var raw = localStorage.getItem(AUTH_CACHE_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.refreshToken){
            refreshTokenVal = parsed.refreshToken;
            idToken = parsed.idToken || null;
            expiresAt = parsed.expiresAt || 0;
          }
        }catch(e){ }
      }
      loadCachedAuth();

      function saveCachedAuth(){
        try{
          localStorage.setItem(AUTH_CACHE_KEY, JSON.stringify({
            idToken: idToken, refreshToken: refreshTokenVal, expiresAt: expiresAt
          }));
        }catch(e){ }
      }

      function applyTokenResponse(data, idField, refreshField, expiresField){
        if (!data) return null;
        idToken = data[idField] || null;
        refreshTokenVal = data[refreshField] || refreshTokenVal;
        var seconds = parseInt(data[expiresField], 10) || 3600;
        expiresAt = Date.now() + (seconds * 1000) - 60000;
        saveCachedAuth();
        return idToken;
      }

      function signInAnonymously(){
        return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_API_KEY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ returnSecureToken: true })
        }).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(data){ return applyTokenResponse(data, 'idToken', 'refreshToken', 'expiresIn'); })
          .catch(function(){ return null; });
      }

      function refreshExistingAuth(){
        if (!refreshTokenVal) return Promise.resolve(null);
        var body = 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(refreshTokenVal);
        return fetch('https://securetoken.googleapis.com/v1/token?key=' + FIREBASE_API_KEY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body
        }).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(data){ return applyTokenResponse(data, 'access_token', 'refresh_token', 'expires_in'); })
          .catch(function(){ return null; });
      }

      function ensureAuth(){
        if (Date.now() < expiresAt) return Promise.resolve(idToken);
        if (authPromise) return authPromise;
        authPromise = (refreshTokenVal ? refreshExistingAuth() : signInAnonymously())
          .then(function(token){
            authPromise = null;
            return token;
          });
        return authPromise;
      }

      /* ===== CONFLICT DETECTION =====
         Перед створенням нового користувача перевіряємо, чи вже існує
         користувач з таким імʼям та прізвищем. */
      function checkUserConflict(firstName, lastName){
        return ensureAuth().then(function(){
          return fetch(FIREBASE_DB_URL + '/users.json?orderByChild=fullName&equalTo="' + encodeURIComponent(firstName + ' ' + lastName) + '"&auth=' + idToken, {
            method: 'GET'
          }).then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        });
      }

      /* ===== WRITE WITH UNIQUE ID =====
         Зберігає користувача з унікальним UUID замість name+lastname. */
      function writeWithUID(path, data){
        if (!data.uid) data.uid = generateUUID();
        
        return ensureAuth().then(function(){
          var url = FIREBASE_DB_URL + path + '.json?auth=' + idToken;
          return fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          }).then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        });
      }

      /* ===== READ BY UID =====
         Читає користувача за його унікальним UID замість за name+lastname. */
      function readByUID(uid){
        return ensureAuth().then(function(){
          var url = FIREBASE_DB_URL + '/users/' + uid + '.json?auth=' + idToken;
          return fetch(url, { method: 'GET' })
            .then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        });
      }

      return {
        write: writeWithUID,
        read: readByUID,
        checkConflict: checkUserConflict,
        generateUID: generateUUID
      };
    })();
  }

  /* ===== AUTH HANDLERS ===== */
  document.getElementById('register-form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('reg-name').value.trim();
    var lastname = document.getElementById('reg-lastname').value.trim();
    var password = document.getElementById('reg-password').value;
    var password2 = document.getElementById('reg-password2').value;
    var errorEl = document.getElementById('register-error');

    errorEl.textContent = '';

    if (!name || !lastname || !password){
      errorEl.textContent = 'Заповніть усі поля';
      return;
    }

    if (password.length < 4){
      errorEl.textContent = 'Пароль має бути не менше 4 символів';
      return;
    }

    if (password !== password2){
      errorEl.textContent = 'Паролі не збігаються';
      return;
    }

    /* ===== CONFLICT CHECK =====
       Перевіряємо, чи не існує вже користувача з таким ім'ям та прізвищем. */
    window.storage.checkConflict(name, lastname).then(function(existing){
      if (existing && Object.keys(existing).length > 0){
        errorEl.textContent = 'Користувач з таким імʼям та прізвищем вже існує. Спробуйте інший варіант.';
        return;
      }

      var uid = window.storage.generateUID();
      var userData = {
        uid: uid,
        name: name,
        lastname: lastname,
        password: password,
        fullName: name + ' ' + lastname,
        isAdmin: false,
        createdAt: Date.now()
      };

      window.storage.write('/users/' + uid, userData).then(function(){
        localStorage.setItem('__auron_user_uid__', uid);
        document.getElementById('auth-screen').classList.add('hidden');
        showUser(uid, name, lastname);
      });
    });
  });

  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('login-name').value.trim();
    var lastname = document.getElementById('login-lastname').value.trim();
    var password = document.getElementById('login-password').value;
    var errorEl = document.getElementById('login-error');

    errorEl.textContent = '';

    if (!name || !lastname || !password){
      errorEl.textContent = 'Заповніть усі поля';
      return;
    }

    /* ===== FIND USER BY NAME+LASTNAME =====
       Ищем користувача за імʼям та прізвищем, потім перевіряємо пароль. */
    window.storage.checkConflict(name, lastname).then(function(users){
      if (!users || Object.keys(users).length === 0){
        errorEl.textContent = 'Користувача не знайдено';
        return;
      }

      var uid = Object.keys(users)[0];
      var user = users[uid];

      if (user.password !== password){
        errorEl.textContent = 'Неправильний пароль';
        return;
      }

      localStorage.setItem('__auron_user_uid__', uid);
      document.getElementById('auth-screen').classList.add('hidden');
      showUser(uid, name, lastname);
    });
  });

  function showUser(uid, name, lastname){
    var isAdmin = (name === ADMIN_NAME && lastname === ADMIN_LASTNAME);
    var avatar = name.charAt(0) + lastname.charAt(0);
    
    console.log('User logged in:', uid, name, lastname, 'isAdmin:', isAdmin);
  }

  // Auth tabs toggle
  document.querySelectorAll('.auth-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      var tabName = this.getAttribute('data-tab');
      document.querySelectorAll('.auth-tab').forEach(function(t){ t.classList.remove('active'); });
      this.classList.add('active');
      
      document.querySelectorAll('.auth-form').forEach(function(f){ f.classList.add('hidden'); });
      document.getElementById(tabName + '-form').classList.remove('hidden');
    });
  });
})();
</script>

</body>
</html>
